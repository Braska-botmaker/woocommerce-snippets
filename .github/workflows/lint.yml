name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none

      - name: Lint every .php file
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find . -name '*.php' -print0)
          exit $status

  json-lint:
    name: code-snippets.json validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            python3 -m json.tool "$file" > /dev/null || status=1
          done < <(find . -name '*.code-snippets.json' -print0)
          exit $status
